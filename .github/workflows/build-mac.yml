name: Build macOS

# macOS 설치본(.dmg)은 macOS 에서만 만들 수 있다(dmg 생성에 hdiutil 필요).
# 개발 PC 가 Windows 라 여기(GitHub 의 실제 맥 머신)에서 빌드해 릴리즈에 붙인다.
# 공개 저장소라 macOS 러너가 무료다.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '결과를 붙일 릴리즈 태그 (예: v1.3.0)'
        required: true
        default: 'v1.3.0'

jobs:
  build:
    runs-on: macos-latest
    # 릴리즈에 파일을 붙이려면 쓰기 권한이 필요하다(기본 토큰은 읽기 전용 → HTTP 403).
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # postinstall 이 현재 플랫폼(mac) 바이너리를 자동으로 받는다.
      # (yt-dlp_macos · ffmpeg 정적빌드 · deno)
      - name: 의존성 + mac 바이너리 설치
        run: npm install

      # Whisper(AI 자막)는 mac prebuilt 가 없어 brew 로 받아 번들한다.
      # 실패해도 빌드는 계속한다 — 앱이 PATH 폴백으로 동작하도록 설계돼 있다.
      - name: Whisper 번들 시도 (선택)
        continue-on-error: true
        run: |
          brew install whisper-cpp || exit 0
          BIN="$(command -v whisper-cli || true)"
          if [ -n "$BIN" ]; then
            mkdir -p resources/mac/whisper
            cp "$BIN" resources/mac/whisper/whisper-cli
            # 동적 라이브러리도 함께 담는다(없으면 실행 시 못 찾는다)
            for L in $(otool -L "$BIN" | awk 'NR>1 {print $1}' | grep -E '^/(opt|usr/local)' || true); do
              cp -f "$L" resources/mac/whisper/ 2>/dev/null || true
            done
            echo "whisper 번들 완료"
          else
            echo "whisper-cli 없음 — PATH 폴백으로 동작"
          fi

      - name: 모델 확인
        run: ls -la resources/models || echo "(모델 없음 — 자막은 폴백)"

      # 코드 서명 없음(애플 개발자 계정 미보유) → 서명 시도를 끈다.
      #
      # zip 을 '먼저·따로' 만든다. 이유 두 가지:
      #  ① mac 자동 업데이트(electron-updater)는 dmg 가 아니라 **zip** 을 요구한다.
      #  ② dmg 생성은 CI 에서 자주 깨진다(hdiutil detach 실패) → zip 이 함께 죽으면 안 된다.
      # ⚠️ --arm64 --x64 를 반드시 붙인다. CLI 로 타깃(zip/dmg)을 지정하면
      #    package.json 의 arch 목록이 무시되고 '러너의 아키텍처'만 빌드된다.
      #    러너가 Apple Silicon 이라 그냥 두면 Intel 맥 사용자가 빠진다.
      - name: zip 빌드 (Apple Silicon + Intel) — 필수
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac zip --arm64 --x64 --publish never

      # dmg 는 '있으면 좋은 것'. 실패해도 zip 으로 배포는 가능하므로 빌드를 멈추지 않는다.
      # 러너에 남은 볼륨이 detach 를 막는 경우가 있어 미리 정리하고 시도한다.
      - name: dmg 빌드 (선택, 실패해도 계속)
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for V in /Volumes/Piggy*; do [ -d "$V" ] && hdiutil detach -force "$V" || true; done
          npx electron-builder --mac dmg --arm64 --x64 --publish never || echo "dmg 실패 — zip 으로 배포"

      - name: 산출물 확인
        run: ls -la dist/*.zip dist/*.dmg 2>/dev/null || ls -la dist/

      - name: 릴리즈에 첨부
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(dist/*.dmg dist/*.zip dist/latest-mac.yml)
          echo "업로드: ${FILES[*]}"
          gh release upload "${{ inputs.tag }}" "${FILES[@]}" --clobber --repo "${{ github.repository }}"

      # 릴리즈 첨부가 실패하더라도 산출물은 남겨 손으로 받을 수 있게 한다.
      - name: 빌드 결과 보관(다운로드용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist/*.dmg
            dist/*.zip
