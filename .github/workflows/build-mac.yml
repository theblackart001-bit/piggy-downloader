name: Build macOS

# macOS 설치본(.dmg)은 macOS 에서만 만들 수 있다(dmg 생성에 hdiutil 필요).
# 개발 PC 가 Windows 라 여기(GitHub 의 실제 맥 머신)에서 빌드해 릴리즈에 붙인다.
# 공개 저장소라 macOS 러너가 무료다.

# 릴리즈가 만들어지면 자동으로 돈다.
# (수동 실행만 걸어뒀더니 v1.6.0 이후 맥 파일이 통째로 빠진 채 v1.8.5 까지 나갔다.
#  매뉴얼은 "릴리즈에서 arm64.dmg 를 받으세요" 라고 안내하는데 파일이 없어서 문의가 들어왔다.)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '결과를 붙일 릴리즈 태그 (예: v1.3.0)'
        required: true
        default: 'v1.3.0'

jobs:
  build:
    runs-on: macos-latest
    # 릴리즈에 파일을 붙이려면 쓰기 권한이 필요하다(기본 토큰은 읽기 전용 → HTTP 403).
    permissions:
      contents: write

    # release 로 자동 실행되면 그 릴리즈의 태그를, 수동 실행이면 입력한 태그를 쓴다.
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}

    steps:
      # release 이벤트면 checkout 이 그 태그를 그대로 받아온다(빌드 버전 = 릴리즈 버전).
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # postinstall 이 현재 플랫폼(mac) 바이너리를 자동으로 받는다.
      # (yt-dlp_macos · ffmpeg 정적빌드 · deno)
      - name: 의존성 + mac 바이너리 설치
        run: npm install

      # ⚠️ Whisper 는 mac 에 번들하지 않는다 (2026-07-27 결정).
      #    brew 로 설치한 whisper-cli 는 /opt/homebrew/lib/*.dylib 를 '절대경로'로 참조한다.
      #    그대로 복사해 넣으면 Homebrew 가 없는 사용자 맥에서 실행되지 않는다.
      #    더 나쁜 건, binaries.js 가 번들본을 **먼저** 찾기 때문에
      #    brew 로 whisper 를 깔아둔 사용자까지 이 깨진 번들본에 걸려 실패한다는 점이다.
      #    → 아예 넣지 않고 PATH 폴백에 맡긴다(brew install whisper-cpp 안내는 매뉴얼에).
      - name: 번들 상태 확인
        run: |
          echo "mac: whisper 는 번들하지 않음 (PATH 폴백)"
          ls -la resources/mac || true
          ls -la resources/models || echo "(모델 없음)"

      # 코드 서명 없음(애플 개발자 계정 미보유) → 서명 시도를 끈다.
      #
      # zip 을 '먼저·따로' 만든다. 이유 두 가지:
      #  ① mac 자동 업데이트(electron-updater)는 dmg 가 아니라 **zip** 을 요구한다.
      #  ② dmg 생성은 CI 에서 자주 깨진다(hdiutil detach 실패) → zip 이 함께 죽으면 안 된다.
      # ⚠️ --arm64 --x64 를 반드시 붙인다. CLI 로 타깃(zip/dmg)을 지정하면
      #    package.json 의 arch 목록이 무시되고 '러너의 아키텍처'만 빌드된다.
      #    러너가 Apple Silicon 이라 그냥 두면 Intel 맥 사용자가 빠진다.
      - name: zip 빌드 (Apple Silicon + Intel) — 필수
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac zip --arm64 --x64 --publish never

      # dmg 는 '있으면 좋은 것'(zip 만으로도 설치·자동업데이트 다 된다).
      # CI 에서 hdiutil detach 가 자주 깨지므로 **아키텍처별로 따로** 만든다 —
      # 한쪽이 실패해도 다른 쪽은 살아남게.
      - name: dmg 빌드 — Apple Silicon (선택)
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for V in /Volumes/Piggy*; do [ -d "$V" ] && hdiutil detach -force "$V" || true; done
          npx electron-builder --mac dmg --arm64 --publish never

      - name: dmg 빌드 — Intel (선택)
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for V in /Volumes/Piggy*; do [ -d "$V" ] && hdiutil detach -force "$V" || true; done
          npx electron-builder --mac dmg --x64 --publish never

      - name: 산출물 확인
        run: ls -la dist/*.zip dist/*.dmg 2>/dev/null || ls -la dist/

      - name: 릴리즈에 첨부
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(dist/*.dmg dist/*.zip dist/latest-mac.yml)
          echo "업로드 대상($TAG): ${FILES[*]}"
          gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${{ github.repository }}"

      # 릴리즈 첨부가 실패하더라도 산출물은 남겨 손으로 받을 수 있게 한다.
      - name: 빌드 결과 보관(다운로드용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist/*.dmg
            dist/*.zip
