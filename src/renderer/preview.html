<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>자막 미리보기</title>
  <style>
    :root {
      --blue: #1f9bf0;
      --blue-d: #0b7fd6;
      --ink: #16324a;
      --line: #e3edf6;
      --ok: #16b364;
      --err: #ef4f56;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: var(--ink);
      background: #f4f8fc;
      display: flex; flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, var(--blue), var(--blue-d));
      color: #fff; padding: 14px 18px;
    }
    .title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
    .url { font-size: 11px; opacity: .85; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .controls {
      display: flex; align-items: center; gap: 8px; margin-top: 12px;
    }
    .controls label { font-size: 12px; opacity: .9; }
    select {
      flex: 0 0 auto; padding: 6px 8px; border-radius: 8px; border: none;
      font-size: 13px; color: var(--ink); background: #fff;
    }
    .btn {
      border: none; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: filter .15s, opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-ghost { background: rgba(255,255,255,.2); color: #fff; }
    .btn-ghost:hover:not(:disabled) { filter: brightness(1.15); }

    .status-wrap { padding: 10px 18px 0; }
    .status { font-size: 13px; font-weight: 700; min-height: 18px; }
    .status.err { color: var(--err); }
    .status.ok { color: var(--ok); }
    .bar { height: 6px; border-radius: 99px; background: var(--line); margin-top: 8px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--blue-d)); transition: width .25s; }
    .bar.indet > i { width: 40%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0%{margin-left:-40%} 100%{margin-left:100%} }

    main { flex: 1; padding: 12px 18px; display: flex; min-height: 0; }
    textarea {
      flex: 1; width: 100%; resize: none; border: 1px solid var(--line); border-radius: 12px;
      padding: 14px; font-size: 14px; line-height: 1.7; color: var(--ink); background: #fff;
      font-family: inherit;
    }
    textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; }

    footer {
      padding: 12px 18px; border-top: 1px solid var(--line); background: #fff;
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .btn-primary { background: var(--ok); color: #fff; }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
    .btn-line { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn-line:hover { background: #f0f5fa; }
  </style>
</head>
<body>
  <header>
    <div class="title">📝 자막 미리보기</div>
    <div class="url" id="url">—</div>
    <div class="controls">
      <label for="lang">언어</label>
      <select id="lang">
        <option value="auto">자동 감지</option>
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
      </select>
      <button class="btn btn-ghost" id="redo" title="선택한 언어로 다시 전사">↻ 다시 전사</button>
    </div>
  </header>

  <div class="status-wrap">
    <div class="status" id="status">준비 중...</div>
    <div class="bar indet" id="bar"><i></i></div>
  </div>

  <main>
    <textarea id="text" readonly placeholder="전사된 대본이 여기에 표시됩니다."></textarea>
  </main>

  <footer>
    <button class="btn btn-primary" id="copy" disabled>📋 복사</button>
    <button class="btn btn-line" id="close">닫기</button>
  </footer>

  <script src="preview.js"></script>
</body>
</html>
